services:
  trading_system:
    build: .
    container_name: ta-trading-system
    env_file:
      - .env
    ports:
      - "127.0.0.1:8054:8054"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./config.json:/app/config.json
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8054), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
